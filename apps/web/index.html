<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" />
    <script>
      // Apply a saved theme before the first paint so a dark choice does not flash white.
      try { var t = localStorage.getItem("zoning-auditor:theme"); if (t === "light") document.documentElement.setAttribute("data-theme", "light"); else if (t !== "system") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
    </script>
    <title>Zoning Map Date Auditor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
